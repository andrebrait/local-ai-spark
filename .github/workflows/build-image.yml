name: Validate local AI image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deployment logic
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile tools/validate_miaai_update.py scripts/watch-memory.py
          bash -n scripts/serve.sh scripts/download-weights.sh

      - name: Reclaim ephemeral runner disk for CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build pinned runtime and verify patch reruns and authentication
        run: docker build -f Dockerfile.local-ai -t local-ai-qwen:ci .
