name: Validate local AI image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.local-ai"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-image.yml"
  pull_request:
    paths:
      - "Dockerfile.local-ai"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deployment logic
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/create-27b.sh scripts/create-swift-27b.sh scripts/local-ai-model scripts/download-weights.sh scripts/smoke-test.sh

      - name: Reclaim ephemeral runner disk for CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          df -h /

      - name: Build pinned runtime and verify authentication
        run: docker build -f Dockerfile.local-ai -t local-ai-qwen:ci .
